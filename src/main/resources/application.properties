spring.application.name=ai-text-processor

# MySQL Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/text_summarizer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Cache Configuration
# Managed programmatically in CacheConfig.java (CaffeineCacheManager)
# Cache names: textSummaries, summaryHistory, summaryHistoryByType, rate-limit-summarize, rate-limit-global

# Logging Configuration
logging.level.root=INFO
logging.level.com.raavi.ai.ai_text_processor=DEBUG
logging.level.com.raavi.ai.ai_text_processor.aspect.CacheAspect=INFO
logging.level.com.raavi.ai.ai_text_processor.config.CacheConfig=INFO
logging.level.com.raavi.ai.ai_text_processor.util.CacheKeyGenerator=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs

# Rate Limiting - Bucket4j (token bucket)
bucket4j.enabled=true
# 'none' disables Bucket4j's cache auto-detection so our custom
# SyncCacheResolver bean (Bucket4jCacheResolver.java) takes over
bucket4j.cache-to-use=none

# Filter 0 - /api/summarizer/summarize (POST) - stricter limit
# 10 requests per 60 seconds per IP
bucket4j.filters[0].cache-name=rate-limit-summarize
bucket4j.filters[0].url=/api/summarizer/summarize
bucket4j.filters[0].http-response-body={"status":429,"errorCode":"RATE_LIMIT_EXCEEDED","message":"Rate limit exceeded for summarize endpoint. Max 10 requests per 60 seconds."}
bucket4j.filters[0].http-content-type=application/json
bucket4j.filters[0].http-status-code=TOO_MANY_REQUESTS
bucket4j.filters[0].http-response-headers[X-RateLimit-Limit]=10
bucket4j.filters[0].http-response-headers[X-RateLimit-Policy]=10 requests per 60 seconds
bucket4j.filters[0].rate-limits[0].cache-key=getHeader('X-Forwarded-For') != null ? getHeader('X-Forwarded-For').split(',')[0].trim() : getRemoteAddr()
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=10
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=60
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=seconds
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=greedy

# Filter 1 - /api/** (all routes) - general limit
# 60 requests per 60 seconds per IP
bucket4j.filters[1].cache-name=rate-limit-global
bucket4j.filters[1].url=/api/.*
bucket4j.filters[1].http-response-body={"status":429,"errorCode":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Max 60 requests per 60 seconds."}
bucket4j.filters[1].http-content-type=application/json
bucket4j.filters[1].http-status-code=TOO_MANY_REQUESTS
bucket4j.filters[1].http-response-headers[X-RateLimit-Limit]=60
bucket4j.filters[1].http-response-headers[X-RateLimit-Policy]=60 requests per 60 seconds
bucket4j.filters[1].rate-limits[0].cache-key=getHeader('X-Forwarded-For') != null ? getHeader('X-Forwarded-For').split(',')[0].trim() : getRemoteAddr()
bucket4j.filters[1].rate-limits[0].bandwidths[0].capacity=60
bucket4j.filters[1].rate-limits[0].bandwidths[0].time=60
bucket4j.filters[1].rate-limits[0].bandwidths[0].unit=seconds
bucket4j.filters[1].rate-limits[0].bandwidths[0].refill-speed=greedy
