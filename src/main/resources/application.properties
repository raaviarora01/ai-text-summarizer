spring.application.name=ai-text-processor

# MySQL Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/text_summarizer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Cache Configuration
# Using Spring Cache abstraction with in-memory cache
# For production distributed systems, switch to Redis cache manager
spring.cache.type=simple
spring.cache.cache-names=textSummaries

# Logging Configuration
logging.level.root=INFO
logging.level.com.raavi.ai.ai_text_processor=DEBUG
logging.level.com.raavi.ai.ai_text_processor.aspect.CacheAspect=INFO
logging.level.com.raavi.ai.ai_text_processor.config.CacheConfig=INFO
logging.level.com.raavi.ai.ai_text_processor.util.CacheKeyGenerator=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
