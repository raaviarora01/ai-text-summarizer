# Test Configuration — uses H2 in-memory DB
# No MySQL or real Gemini API key required
spring.application.name=ai-text-processor-test

# H2 In-Memory Database (replaces MySQL for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fake Gemini API key (GeminiService mocked in tests, but @Value injection still needs a value)
gemini.api.key=test-api-key-not-real-123456789012345
gemini.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/

# Server
server.port=8080
server.servlet.context-path=/

# Suppress noisy logs during tests
logging.level.root=WARN
logging.level.com.raavi.ai.ai_text_processor=INFO
logging.level.org.springframework.cache=DEBUG

# Disable Bucket4j for most unit/slice tests (integration tests re-enable it)
bucket4j.enabled=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
